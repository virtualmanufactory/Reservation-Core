# Profile used by unit/integration tests (in-memory H2 in PostgreSQL mode)
app.cleanup.enabled=false
app.base-url=http://localhost:8080

spring.datasource.url=jdbc:h2:mem:reservation_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mail stubowany przez TestMailConfig; wartości tylko żeby autokonfiguracja nie padała
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.main.allow-bean-definition-overriding=true
