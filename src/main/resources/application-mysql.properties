# Profil produkcyjny / docelowy: MySQL
# Uruchomienie:
#   java -jar reservation-core.jar --spring.profiles.active=mysql \
#     --spring.config.additional-location=file:/etc/reservation-core/

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reservation_core_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Na istniejącej bazie z tabelą oddzial użyj validate; update tylko przy pierwszym wdrożeniu staging/logów
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
