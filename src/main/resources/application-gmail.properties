# Profil produkcyjny / zewnętrzny SMTP (Gmail STARTTLS).
# Uruchomienie: mvn spring-boot:run -Dspring-boot.run.profiles=gmail
#
# Uzupełnij username i hasło aplikacji Google przed użyciem.

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=twoj_mail@gmail.com
spring.mail.password=twoje_haslo_aplikacji
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
