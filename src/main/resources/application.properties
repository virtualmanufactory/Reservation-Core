#base url
app.base-url=http://localhost:8080

# Cleanup jobs
app.cleanup.unconfirmed-hours=24
app.cleanup.past-slots-days=30
app.cleanup.enabled=true

# Default locale for confirmation emails / generator
app.default-locale=pl

#Database (H2 for local/dev; override with PostgreSQL in production)
spring.datasource.url=jdbc:h2:mem:reservation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#email notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=twoj_mail@gmail.com
spring.mail.password=twoje_haslo_aplikacji
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pl
spring.web.locale-resolver=accept-header

# Serve restaurant frontend
spring.web.resources.static-locations=classpath:/static/
