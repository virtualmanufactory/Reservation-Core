#base url
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Cleanup jobs
app.cleanup.unconfirmed-hours=24
app.cleanup.past-slots-days=30
app.cleanup.enabled=true

# Default locale for confirmation emails / generator
app.default-locale=pl

# ---------------------------------------------------------------------------
# Baza danych — dane dostępowe WYŁĄCZNIE z zewnętrznej konfiguracji / ENV
# (nie commituj haseł). Lokalnie: plik config/application-local.properties
# lub zmienne DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD.
# Produkcja MySQL: profil `mysql` + /etc/reservation-core/application.properties
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation_core_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Dodatkowa lokalizacja konfiguracji zewnętrznej (hasła, hosty, SAP)
spring.config.import=optional:file:./config/application-local.properties,optional:file:/etc/reservation-core/application.properties

# ---------------------------------------------------------------------------
# SAP sync — zasilenie tabeli oddzial (UPSERT / staging, bez truncate+reload)
# ---------------------------------------------------------------------------
app.sap.enabled=${SAP_SYNC_ENABLED:true}
app.sap.cron=${SAP_SYNC_CRON:0 0 * * * *}
app.sap.strategy=${SAP_SYNC_STRATEGY:UPSERT}
app.sap.obsolete-mode=${SAP_OBSOLETE_MODE:SOFT_DELETE}
app.sap.obsolete-status=${SAP_OBSOLETE_STATUS:NIEAKTUALNY}
app.sap.source.type=${SAP_SOURCE_TYPE:FILE}
app.sap.source.file-path=${SAP_SOURCE_FILE:./config/sap-feed.json}
app.sap.source.url=${SAP_SOURCE_URL:}
app.sap.source.username=${SAP_SOURCE_USERNAME:}
app.sap.source.password=${SAP_SOURCE_PASSWORD:}
app.sap.source.connect-timeout-ms=5000
app.sap.source.read-timeout-ms=30000

# Logging przebiegu zasilenia SAP
logging.level.com.reservation.sap=INFO

# Email (domyślnie MailHog — start z Podman, UI: http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pl
spring.web.locale-resolver=accept-header

# Serve restaurant frontend
spring.web.resources.static-locations=classpath:/static/
