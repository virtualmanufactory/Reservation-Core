#base url
app.base-url=http://localhost:8080

# Cleanup jobs
app.cleanup.unconfirmed-hours=24
app.cleanup.past-slots-days=30
app.cleanup.enabled=true

# Default locale for confirmation emails / generator
app.default-locale=pl

# PostgreSQL (real database) — start via Podman: see podman/reservation-core-compose.yaml.example
spring.datasource.url=jdbc:postgresql://localhost:5432/reservation_core_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Email (domyślnie MailHog — start z Podman, UI: http://localhost:8025)
# Prawdziwy Gmail: mvn spring-boot:run -Dspring-boot.run.profiles=gmail
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=pl
spring.web.locale-resolver=accept-header

# Serve restaurant frontend
spring.web.resources.static-locations=classpath:/static/
